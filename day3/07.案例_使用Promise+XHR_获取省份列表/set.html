<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=     , initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" class="context" />
    <button style="height: 5px"></button>
    <p class="answer"></p>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    document.querySelector("button").addEventListener("click", () => {
      // 必须在点击按钮的时候去获取输入框的最新值！
      const myQuestion = document.querySelector(".context").value;

      // 如果输入为空，提醒用户
      if (!myQuestion.trim()) {
        alert("请输入问题！");
        return;
      }

      // 为了体验好一点，请求时先显示“思考中...”
      document.querySelector(".answer").innerHTML = "DeepSeek 思考中...";

      axios({
        method: "POST",
        url: "https://api.deepseek.com/chat/completions",
        headers: {
          Authorization: "Bearer sk-58fd6fc679cb4b**************0b2",
          "Content-Type": "application/json",
        },
        data: {
          model: "deepseek-chat",
          messages: [
            {
              role: "user",
              content: myQuestion,
            },
          ],
          temperature: 0.7,
        },
      })
        .then((res) => {
          // axios 返回的数据，真正的业务数据包裹在 data 属性里
          document.querySelector(".answer").innerHTML =
            res.data.choices[0].message.content;
        })
        .catch((err) => {
          console.error("请求报错:", err);
          document.querySelector(".answer").innerHTML =
            "请求失败，请检查控制台报错信息。";
        });
    });
  </script>
</html>
