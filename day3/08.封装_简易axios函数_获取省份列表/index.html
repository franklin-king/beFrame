<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>封装_简易axios函数_获取省份列表</title>
  </head>

  <body>
    <p class=""></p>
    <script>
      /**
       * 目标：封装_简易axios函数_获取省份列表
       *  1. 定义myAxios函数，接收配置对象，返回Promise对象
       *  2. 发起XHR请求，默认请求方法为GET
       *  3. 调用成功/失败的处理程序
       *  4. 使用myAxios函数，获取省份列表展示
       */
      function myaxios(config) {
        return new Promise((reslove, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open(config.mehtod || "GET", config.url);
          xhr.addEventListener("loadend", () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              reslove(JSON.parse(xhr.response));
            } else {
              reject(new Error(xhr.response));
            }
          });
          xhr.send();
        });
      }

      myaxios({
        url: "https://hmajax.itheima.net/api/province",
      })
        .then((res) => {
          console.log(res);
          document.querySelector(".my-p").innerHTML = res.list.join("<br>");
        })
        .catch((err) => {
          console.log(err);
          document.querySelector(".my-p").innerHTML = err.message;
        });
    </script>
  </body>
</html>
